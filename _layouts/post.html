<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTitle}}</title>
    <link rel="stylesheet" href="{{baseurl}}/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    {{seoMeta}}
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="scan-line"></div>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <a href="{{baseurl}}/" class="logo-link">
                    <span class="logo-icon">&#9881;</span>
                    <span class="logo-text">YSD<span class="accent">LAB</span></span>
                </a>
            </div>
            <button class="nav-toggle" aria-label="菜单">&#9776;</button>
            <nav class="nav">
                <a href="{{baseurl}}/" class="nav-link">首页</a>
                <a href="{{baseurl}}/weekly/" class="nav-link">周报</a>
                <a href="{{baseurl}}/issues/" class="nav-link">问题追踪</a>
            </nav>
            <div class="header-status">
                <span class="status-dot online"></span>
                <span class="status-text">SYSTEM ONLINE</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="org-banner">
            <span class="org-name">粤水电智能制造研究院</span>
            <span class="org-divider">|</span>
            <span class="org-dev">研发人员：屈雪松</span>
        </div>
        {{content}}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-left"><span>YSDLAB © 2026</span></div>
            <div class="footer-right">
                <span class="footer-tag">#CrawlerRobot</span>
                <span class="footer-tag">#InspectionVehicle</span>
            </div>
        </div>
    </footer>

    <script src="{{baseurl}}/assets/js/main.js"></script>
</body>
</html>
